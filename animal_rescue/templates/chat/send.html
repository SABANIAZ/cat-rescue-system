{% extends 'base.html' %}
{% block title %}Send Message | Cat Rescue{% endblock %}
{% block content %}
<section class="page-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-4 shadow-sm">
                    <h2 class="fw-bold mb-3">Message {{ recipient.username }}</h2>
                    {% if rescue %}
                        <p class="text-muted">Conversation for rescue: <strong>{{ rescue.title }}</strong></p>
                    {% endif %}
                    <form method="POST">
                        {% csrf_token %}
                        <div class="mb-3">{{ form.message.label_tag }}{{ form.message }}</div>
                        <button type="submit" class="btn btn-primary">Send Message</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
