{% extends 'base.html' %}
{% block title %}Inbox | Cat Rescue{% endblock %}
{% block content %}
<section class="page-section py-5">
    <div class="container">
        <div class="card p-4 shadow-sm">
            <h2 class="fw-bold mb-4">Inbox</h2>
            <div class="list-group">
                {% for partner in partners %}
                <a href="{% url 'conversation' partner.id %}" class="list-group-item list-group-item-action d-flex justify-content-between align-items-center">
                    <span>{{ partner.username }}</span>
                    <span class="badge bg-primary rounded-pill">View</span>
                </a>
            {% empty %}
                <p class="text-muted">No messages yet.</p>
            {% endfor %}
            </div>
        </div>
    </div>
</section>
{% endblock %}
