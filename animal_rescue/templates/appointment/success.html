{% extends 'base.html' %}
{% block title %}Appointment Booked | Cat Rescue{% endblock %}
{% block content %}
<section class="page-section py-5">
    <div class="container">
        <div class="card p-5 shadow-sm text-center">
            <h2 class="fw-bold mb-3">Appointment Confirmed</h2>
            <p class="lead text-muted">Your appointment with <strong>{{ appointment.cat.name }}</strong> is scheduled for <strong>{{ appointment.scheduled_date|date:'D, M j, Y H:i' }}</strong>.</p>
            <a href="{% url 'my_appointments' %}" class="btn btn-primary mt-4">View Appointments</a>
        </div>
    </div>
</section>
{% endblock %}
